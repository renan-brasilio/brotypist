name: Cross-platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Build portable x86 inference backend
        if: runner.os != 'macOS'
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: python -m pip install --no-cache-dir --no-binary=llama-cpp-python --no-deps llama-cpp-python==0.3.36
      - name: Install desktop, local inference, and test dependencies
        run: python -m pip install -e ".[dev,local,build]"
      - name: Check syntax on every platform module
        run: python -m compileall -q src
      - name: Run deterministic safety regressions
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Report native capabilities
        run: inklow doctor
      - name: Acquire checksum-verified lightweight CI model
        run: inklow model download --preset tiny
      - name: Exercise real local inference
        run: python tools/smoke_bundle.py --source-worker
      - name: Launch real native settings utility
        timeout-minutes: 1
        run: python tools/smoke_desktop.py
      - name: Build installable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Build native desktop application
        run: python tools/build_app.py
      - name: Exercise packaged local inference
        run: python tools/smoke_bundle.py
      - name: Archive native application preserving bundle symlinks
        run: python -c "import pathlib,sys,tarfile; root=pathlib.Path('dist'); name='Inklow.app' if sys.platform=='darwin' else 'Inklow'; archive=root/('Inklow-'+sys.platform+'.tar.gz'); bundle=tarfile.open(archive,'w:gz'); bundle.add(root/name,arcname=name); bundle.close()"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: inklow-${{ matrix.os }}
          path: |
            test-results.xml
            dist/*.whl
            dist/Inklow-*.tar.gz
            worker-smoke.json
          retention-days: 14
