name: macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Validate this version and build macOS installers; cross-platform release publication is paused'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate release version
        id: version
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          RELEASE_BRANCH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_BRANCH" ]; then REQUESTED_TAG="v${RELEASE_BRANCH#release/}"; fi
          python3 tools/release_assets.py version --tag "$REQUESTED_TAG"
  verify:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      INKLOW_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install desktop, local inference, and test dependencies
        run: python -m pip install -e ".[dev,local,build]"
      - name: Check syntax on every platform module
        run: python -m compileall -q src tools
      - name: Run deterministic safety regressions
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Report native capabilities
        run: brotypist doctor
      - name: Acquire checksum-verified lightweight CI model
        run: brotypist model download --preset tiny
      - name: Exercise real local inference
        run: python tools/smoke_bundle.py --source-worker
      - name: Launch real native settings utility
        timeout-minutes: 1
        run: python tools/smoke_desktop.py
      - name: Build installable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Build native desktop application
        run: python tools/build_app.py
      - name: Exercise packaged local inference
        run: python tools/smoke_bundle.py
      - name: Package macOS disk image and portable application
        run: python tools/package_macos.py --bundle dist/BroTypist.app --output release --version "$INKLOW_VERSION"
      - name: Mount and exercise actual macOS installer
        run: python tools/smoke_macos_dmg.py --dmg "release/BroTypist-$INKLOW_VERSION-macos-arm64.dmg" --version "$INKLOW_VERSION" --require-gui
      - name: Seal successful native asset provenance
        shell: bash
        run: |
          receipt=reports/macos-dmg-smoke.json
          python tools/release_assets.py manifest --assets release --target "${{ matrix.target }}" --commit "${{ github.sha }}" --receipt "$receipt"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: checks-${{ matrix.target }}
          path: |
            test-results.xml
            dist/*.whl
            worker-smoke.json
            reports/
          retention-days: 14
      - name: Preserve failed installer payloads for native diagnosis
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-packages-${{ matrix.target }}
          path: release/
          if-no-files-found: ignore
          retention-days: 7
