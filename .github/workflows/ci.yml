name: Cross-platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install desktop, local inference, and test dependencies
        run: python -m pip install -e ".[dev,local]"
      - name: Check syntax on every platform module
        run: python -m compileall -q src
      - name: Run deterministic safety regressions
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Report native capabilities
        run: inklow doctor
      - name: Acquire checksum-verified starter model
        run: inklow model download
      - name: Exercise real local inference
        run: python -c "from inklow.config import load_config; from inklow.providers import create_provider; p = create_provider(load_config()); print(p.complete('Thank you for your', '')); p.close()"
      - name: Build installable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: inklow-${{ matrix.os }}
          path: |
            test-results.xml
            dist/*.whl
          retention-days: 14
