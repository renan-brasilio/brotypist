# Native compile/runtime evidence and development portable binaries only.
# No installer, publisher signing, notarization, OTA, release or deployment claims.
name: Native Rust checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional v-prefixed version to validate with Rust xtask (does not publish)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: native-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            platform: macos-arm64
            target: aarch64-apple-darwin
            rustflags: ''
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - os: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '3'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      NATIVE_TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      RUST_BACKTRACE: '1'
      REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      RELEASE_BRANCH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare isolated native evidence directories
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'brotypist-native-target'
          $env:INKLOW_HOME = Join-Path $env:RUNNER_TEMP 'brotypist-native-profile'
          $env:NATIVE_REPORTS = Join-Path $env:RUNNER_TEMP 'brotypist-native-reports'
          $env:NATIVE_PORTABLE = Join-Path $env:RUNNER_TEMP 'brotypist-native-portable'
          foreach ($name in @('CARGO_TARGET_DIR', 'INKLOW_HOME', 'NATIVE_REPORTS', 'NATIVE_PORTABLE')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
          New-Item -ItemType Directory -Force -Path $env:INKLOW_HOME, $env:NATIVE_REPORTS, $env:NATIVE_PORTABLE | Out-Null
      - name: Select pinned Xcode 27.1
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          $developer = '/Applications/Xcode_27.1.app/Contents/Developer'
          if (!(Test-Path -LiteralPath $developer)) { throw 'The xcode-27 image must provide Xcode 27.1.' }
          "DEVELOPER_DIR=$developer" >> $env:GITHUB_ENV
          'MACOSX_DEPLOYMENT_TARGET=15.0' >> $env:GITHUB_ENV
      - name: Install Linux native build and desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: |
          sudo apt-get update 2>&1 | tee "$NATIVE_REPORTS/apt-update.log"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-3-dev libpango1.0-dev \
            libcairo2-dev libdbus-1-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libssl-dev libsecret-1-dev libgl1-mesa-dev dbus-x11 at-spi2-core xvfb xauth \
            fonts-dejavu-core fonts-noto-color-emoji patchelf desktop-file-utils \
            2>&1 | tee "$NATIVE_REPORTS/linux-dependencies.log"
      - name: Configure installed MSVC and Windows SDK
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: ./.github/native/msvc.ps1
      - name: Install repository-pinned Rust toolchain
        timeout-minutes: 10
        run: |
          rustup toolchain install 1.99.1 --profile minimal 2>&1 | Tee-Object -FilePath "$env:NATIVE_REPORTS/rustup-install.log"
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          rustup target add $env:NATIVE_TARGET --toolchain 1.99.1 2>&1 | Tee-Object -FilePath "$env:NATIVE_REPORTS/rustup-target.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native Rust target installation failed.' }
          rustc --version --verbose | Tee-Object -FilePath "$env:NATIVE_REPORTS/rustc.log"
          if ($LASTEXITCODE -ne 0) { throw 'Rust compiler is unavailable.' }
      - name: Validate native version and pinned source prerequisites
        timeout-minutes: 5
        run: ./.github/native/checks.ps1 -Phase prerequisites
      - name: Type-check locked native workspace and all targets
        timeout-minutes: 20
        run: ./.github/native/checks.ps1 -Phase check
      - name: Run locked native workspace tests
        timeout-minutes: 20
        run: ./.github/native/checks.ps1 -Phase test
      - name: Build locked native binaries and smoke executables
        timeout-minutes: 25
        run: ./.github/native/checks.ps1 -Phase build
      - name: Exercise native CLI and checksum-verified tiny model download
        timeout-minutes: 10
        run: ./.github/native/checks.ps1 -Phase cli
      - name: Exercise real native worker protocol and local inference
        timeout-minutes: 8
        run: ./.github/native/checks.ps1 -Phase worker
      - name: Exercise canonical native desktop and capture PNG and JSON evidence
        timeout-minutes: 5
        run: ./.github/native/checks.ps1 -Phase desktop
      - name: Assemble and inspect development portable binaries (not installers or OTA)
        timeout-minutes: 30
        run: ./.github/native/checks.ps1 -Phase portable
      - name: Retain actual native logs and smoke evidence
        if: ${{ always() && env.NATIVE_REPORTS != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-evidence-${{ matrix.platform }}
          path: ${{ env.NATIVE_REPORTS }}/
          if-no-files-found: error
          retention-days: 14
      - name: Retain development portable binaries and provenance
        if: ${{ always() && env.NATIVE_PORTABLE != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: development-portable-${{ matrix.platform }}-not-for-ota
          # Explicit payload paths exclude retained failed Cargo staging trees.
          # Hidden development markers are mandatory non-release provenance.
          path: |
            ${{ env.NATIVE_PORTABLE }}/BroTypist.app/
            ${{ env.NATIVE_PORTABLE }}/BroTypist/
            ${{ env.NATIVE_PORTABLE }}/*.tar.gz
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
