[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "brotypist"
version = "0.4.11"
description = "Local-first predictive typing across macOS, Windows, and Linux"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7; sys_platform != 'darwin'",
  "platformdirs>=4,<5",
  "pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
  "keyring>=25.5,<26",
  "cryptography>=44,<47",
  "comtypes>=1.4; sys_platform == 'win32'",
  "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
local = ["llama-cpp-python==0.3.36"]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
brotypist = "inklow.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/inklow"]
